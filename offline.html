<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Hors ligne</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0d0d0f; color: #e8e8ec; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .box { text-align: center; padding: 40px 24px; max-width: 420px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 22px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #a8a8b3; font-size: 14.5px; line-height: 1.6; margin: 0 0 24px; }
    button { background: linear-gradient(135deg, #ff6b1a, #ff8c42); color: #fff; border: none;
             border-radius: 10px; padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .hint { margin-top: 18px; font-size: 12px; color: #6a6a76; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/img/icon.svg" alt="Inko" class="logo">
    <h1>Tu es hors ligne</h1>
    <p>Impossible de joindre Inko pour l'instant. Ta bibliothèque et les chapitres déjà téléchargés restent accessibles une fois la connexion revenue.</p>
    <button onclick="location.reload()">Réessayer</button>
    <div class="hint">Cette page s'affiche quand le réseau est indisponible.</div>
  </div>
  <script src="assets/js/i18n.js"></script>
  <script>
    // Recharge automatiquement dès que la connexion revient
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
