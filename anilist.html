<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Connexion AniList</title>
  <!-- meta:auto -->
    <meta name="description" content="Connexion du compte AniList pour synchroniser ta progression.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Inko">
    <meta property="og:title" content="Inko — Connexion AniList">
    <meta property="og:description" content="Connexion du compte AniList pour synchroniser ta progression.">
    <meta property="og:image" content="/assets/img/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Inko — Connexion AniList">
    <meta name="twitter:description" content="Connexion du compte AniList pour synchroniser ta progression.">
    <!-- meta:auto -->
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0d0d0f;color:#f0f0f2;font-family:'Segoe UI',sans-serif;text-align:center}
    .box{max-width:340px;padding:24px}
    .logo{width:56px;height:56px;margin-bottom:16px}
    h1{font-size:18px;margin:0 0 8px}
    p{color:#a8a8b3;font-size:13.5px;line-height:1.5}
    .ok{color:#7ee2a0}
    /* Audit BUG-15 : sans paramètres OAuth, cette page affichait « Connexion
       échouée » sur 15 nœuds — aucun en-tête, aucun lien, aucun bouton. Un
       utilisateur qui atterrit là (favori, annulation côté AniList, erreur du
       fournisseur) était bloqué et devait taper une URL à la main. */
    .actions{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .actions a{display:inline-block;padding:9px 16px;border-radius:10px;font-size:13.5px;
      text-decoration:none;border:1px solid rgba(255,255,255,.14);color:#f0f0f2}
    .actions a.primary{background:#c1531b;border-color:#c1531b}
    .actions a:hover{border-color:#c1531b}
  </style>
</head>
<body>
  <main class="box" id="main">
    <img class="logo" src="/assets/img/icon.svg" alt="">
    <h1 id="t">Connexion à AniList…</h1>
    <p id="m">Un instant, on récupère ton autorisation.</p>
    <div class="actions" id="actions" hidden>
      <a class="primary" href="/parametres.html">Retour aux paramètres</a>
      <a href="/accueil.html">Accueil</a>
    </div>
  </main>
  <script src="assets/js/i18n.js"></script>
  <script>
    (function () {
      var t = document.getElementById('t'), m = document.getElementById('m');
      var hash = location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      var token = params.get('access_token');
      if (token) {
        try { localStorage.setItem('anilist_token', token); } catch (e) {}
        t.textContent = 'Compte AniList lié';
        t.className = 'ok';
        m.textContent = 'Tu peux fermer cette fenêtre.';
        // Si ouverte en popup, on se ferme ; sinon on revient aux paramètres
        setTimeout(function () {
          if (window.opener) { try { window.close(); } catch (e) {} return; }
          var back = null;
          try { back = localStorage.getItem('anilist_return'); localStorage.removeItem('anilist_return'); } catch (e) {}
          if (back && back.indexOf('/anilist') === 0) back = null;   // jamais de boucle
          location.href = (back || '/parametres.html') + (back && back.indexOf('?') > -1 ? '&' : '?') + 'anilist=linked';
        }, 900);
      } else if (!hash && !location.search) {
        // DESK-03 : ouverte SANS aucun paramètre, cette page annonçait
        // « Connexion échouée — Autorisation annulée ». C'est faux : personne
        // n'a rien annulé, l'écran a simplement été ouvert directement (un
        // signet, un retour arrière). Annoncer un échec qui n'a pas eu lieu
        // envoie chercher un problème inexistant.
        t.textContent = 'Lier un compte AniList';
        m.textContent = "Cette page reçoit la réponse d'AniList après une autorisation. "
          + "La liaison se lance depuis les paramètres d'Inko.";
        document.getElementById('actions').hidden = false;
      } else {
        var err = params.get('error_description') || new URLSearchParams(location.search).get('error') || 'Autorisation annulée';
        t.textContent = 'Connexion échouée';
        // Audit BUG-15 : on explique ET on propose une sortie, au lieu de
        // laisser l'utilisateur sur un cul-de-sac.
        m.textContent = err + ' — ton compte Inko n\'a pas été modifié. Tu peux relancer la liaison depuis les paramètres.';
        document.getElementById('actions').hidden = false;
      }
    })();
  </script>
</body>
</html>
