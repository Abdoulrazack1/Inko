<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Profil</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .up-wrap { max-width: 820px; margin: 0 auto; padding: 26px 20px 80px; }
    .up-top { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; flex-wrap: wrap; }
    .up-avatar { width: 86px; height: 86px; border-radius: 24px; background: linear-gradient(135deg, var(--orange), #ff8c42); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 800; color: #fff; overflow: hidden; flex-shrink: 0; }
    .up-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .up-name { font-family: var(--font-head); font-size: 26px; font-weight: 700; }
    .up-since { color: var(--text3); font-size: 12.5px; margin-top: 3px; }
    .up-bio { color: var(--text2); font-size: 13.5px; margin-top: 8px; max-width: 560px; line-height: 1.5; }
    .up-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 13px; margin-bottom: 26px; }
    .up-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
    .up-card .v { font-size: 26px; font-weight: 800; font-family: var(--font-head); }
    .up-card .l { font-size: 11.5px; color: var(--text3); margin-top: 6px; }
    .up-card.accent .v { color: var(--orange); }
    .up-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .up-panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
    .up-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .up-badge { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 13px 6px; border-radius: 12px; background: var(--bg3); border: 1px solid var(--border2); text-align: center; }
    .up-badge span.ic { font-size: 26px; line-height: 1; }
    .up-badge span.nm { font-size: 11px; font-weight: 600; }
    .up-msg { text-align: center; padding: 70px 20px; color: var(--text3); }
  </style>
</head>
<body class="page-body">
  <div id="header-slot"></div>
  <div class="up-wrap">
    <div id="upBody"><div class="up-msg"><div class="spinner-inline"></div></div></div>
  </div>
  <div id="footer-slot"></div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/userdata.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script src="assets/js/global.js"></script>
  <script src="assets/js/u.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
