# ============================================================
# Inko — orchestration de production (app + MySQL)
# ============================================================
# Démarrage :  docker compose up -d --build
# Accès      :  http://localhost:8088
#
# ⚠ AVANT LE PREMIER DÉMARRAGE (audit S-1) : crée un fichier .env à côté de ce
#   fichier avec AU MINIMUM un secret JWT fort — sans lui, le conteneur refuse
#   de démarrer (plus de secret par défaut devinable) :
#     JWT_SECRET=$(openssl rand -hex 32)
#     DB_PASSWORD=un-mot-de-passe-solide
#   Et si tu exposes l'instance en ligne, ajoute la liste blanche CORS :
#     CORS_ORIGINS=https://inko.exemple.com

services:
  inko-db:
    image: mysql:8
    container_name: inko-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-inko_root}
      MYSQL_DATABASE: ${DB_NAME:-inko}
    volumes:
      - inko-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-inko_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [inko]

  inko-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inko-app
    restart: unless-stopped
    depends_on:
      inko-db:
        condition: service_healthy
    environment:
      # Profil de déploiement "always-on" : en production, requestReset ne
      # renvoie jamais le token de reset dans la réponse HTTP (audit N19/F.5).
      NODE_ENV: production
      PORT: 8080
      # Fuseau utilisé pour la heatmap et les séries de lecture (audit N55)
      STATS_TZ: ${STATS_TZ:-Europe/Paris}
      DB_HOST: inko-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-inko_root}
      DB_NAME: ${DB_NAME:-inko}
      # PAS de valeur par défaut (audit S-1) : si JWT_SECRET est vide, le
      # conteneur s'arrête au démarrage plutôt que de tourner avec un secret
      # public. Définis-le dans .env — voir l'en-tête de ce fichier.
      JWT_SECRET: ${JWT_SECRET:?definis JWT_SECRET dans un fichier .env — voir en-tete}
      # Liste blanche CORS quand l'instance est exposée en ligne. Sans elle, en
      # prod, les origines tierces sont refusées (audit S-1). Ex :
      # CORS_ORIGINS: "https://inko.exemple.com"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: 1
    ports:
      - "8088:8080"
    networks: [inko]

  # (audit B-5) inko-cache/REDIS_URL retirés : aucun code serveur n'utilise
  # Redis (pas de dépendance, pas de require) — un conteneur Redis inutile
  # pesait sur les petits auto-hébergements (Raspberry Pi, NAS). À réintroduire
  # le jour où un vrai cache partagé sera câblé.

  # ── Accès distant SANS ouverture de port (optionnel — Partie H de l'audit) ──
  # Cloudflare Tunnel : expose le hub sur ton sous-domaine sans IP publique.
  # 1. Crée un tunnel sur one.dash.cloudflare.com (Zero Trust → Tunnels),
  #    pointe-le vers http://inko-app:8080, copie le token dans .env :
  #    TUNNEL_TOKEN=eyJh…
  # 2. Décommente le bloc ci-dessous puis `docker compose up -d`.
  # (Alternative encore plus simple sans domaine : installer Tailscale sur la
  #  machine hôte — voir README « Le mode hub à la maison ».)
  # inko-tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: inko-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   depends_on: [inko-app]
  #   networks: [inko]

volumes:
  inko-db-data:

networks:
  inko:
    driver: bridge
