<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Bibliothèque</title>
  <!-- meta:auto -->
    <meta name="description" content="Ta bibliothèque : séries suivies, mises à jour, signets et téléchargements.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Inko">
    <meta property="og:title" content="Inko — Bibliothèque">
    <meta property="og:description" content="Ta bibliothèque : séries suivies, mises à jour, signets et téléchargements.">
    <meta property="og:image" content="/assets/img/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Inko — Bibliothèque">
    <meta name="twitter:description" content="Ta bibliothèque : séries suivies, mises à jour, signets et téléchargements.">
    <!-- meta:auto -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/bibliotheque.css">
</head>
<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">

  <div class="lib2-wrap">
    <div class="lib2-head">
      <div>
        <h1>Ma bibliothèque</h1>
        <div id="libSummary" style="font-size:12.5px;color:var(--text3);margin-top:2px"></div>
      </div>
      <div class="lib2-tabs" role="tablist" aria-label="Vues de la bibliotheque">
        <button class="lib2-tab active" role="tab" aria-selected="true" data-tab="library">Bibliothèque</button>
        <button class="lib2-tab" role="tab" aria-selected="false" data-tab="updates">Mises à jour</button>
        <button class="lib2-tab" role="tab" aria-selected="false" data-tab="bookmarks">Signets</button>
        <button class="lib2-tab" role="tab" aria-selected="false" data-tab="downloads">Téléchargements</button>
      </div>
    </div>

    <!-- TAB BIBLIOTHÈQUE -->
    <div id="tabLibrary">
      <div class="lib2-toolbar">
        <input type="text" class="lib2-search" id="libSearch" placeholder="Filtrer ma bibliothèque…">
        <!-- Audit QUAL-05 : sans nom accessible, un lecteur d'écran annonce
             « liste déroulante » sans dire de quoi il s'agit. Le libellé
             visible manque par choix de mise en page ; aria-label le fournit. -->
        <select class="lib2-sort" id="libSort" aria-label="Trier la bibliothèque">
          <option value="recent">Récemment ajoutés</option>
          <option value="recent-read">Récemment lus</option>
          <option value="title">Titre A→Z</option>
          <option value="unread">Non-lus d'abord</option>
          <option value="progress">Progression</option>
          <!-- Audit AMEL-32 : 55 578 chapitres non lus n'etaient qu'un nombre ;
               ce tri met devant les series ou le retard est le plus grand. -->
          <option value="backlog">À rattraper (retard le + grand)</option>
          <!-- Audit AMEL-35 : savoir quelles series bougent encore. -->
          <option value="activity">Activité de la source</option>
        </select>
        <div class="lib2-view" id="libViewToggle" role="group" aria-label="Vue">
          <button data-view="grid" class="on" title="Vue grille" aria-label="Vue grille"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
          <button data-view="list" title="Vue liste" aria-label="Vue liste"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
        </div>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibDensity" title="Changer la densité d'affichage"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Compact</button>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibSelect" title="Sélectionner plusieurs séries"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Sélectionner</button>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibRandom" title="Ouvrir une série au hasard dans ma bibliothèque"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>Au hasard</button>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibExport" title="Télécharger une sauvegarde de mes données (JSON)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Exporter</button>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibExportCsv" title="Exporter la bibliothèque en CSV (tableur, Goodreads…)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>CSV</button>
        <button class="btn btn-secondary btn-sm ic-btn" id="btnLibImport" title="Restaurer une sauvegarde (JSON)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5"/><path d="M12 4v12"/></svg>Importer</button>
        <!-- Audit AMEL-34 : accepte desormais aussi le CSV que l export produit. -->
        <input type="file" id="libImportFile" accept="application/json,.json,text/csv,.csv" style="display:none">
        <button class="btn btn-primary btn-sm" id="btnLibRefresh" title="Vérifier les nouveaux chapitres de toute la bibliothèque">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" style="vertical-align:-2px;margin-right:5px"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>Mettre à jour
        </button>
        <span id="libRefreshStatus" style="font-size:12px;color:var(--text3)"></span>
      </div>
      <div class="lib2-resume" id="libResume" style="display:none"></div>
      <div class="lib2-filters" id="libFilters"></div>
      <div class="lib2-grid" id="libGrid">
        <div class="lib2-empty" style="grid-column:1/-1"><div class="spinner-inline"></div></div>
      </div>
    </div>

    <!-- TAB MISES À JOUR -->
    <div id="tabUpdates" style="display:none">
      <div class="lib2-toolbar">
        <button class="btn btn-primary btn-sm" id="btnCheckUpdates">Vérifier les nouveaux chapitres</button>
        <button class="btn btn-secondary btn-sm" id="btnNotify" title="Recevoir une notification du navigateur quand une série suivie a un nouveau chapitre">Notifications</button>
        <span id="updStatus" style="font-size:12.5px;color:var(--text3)"></span>
      </div>
      <div id="updList"></div>
    </div>

    <!-- TAB SIGNETS -->
    <div id="tabBookmarks" style="display:none">
      <div id="bmList"></div>
    </div>

    <!-- TAB TÉLÉCHARGEMENTS -->
    <div id="tabDownloads" style="display:none">
      <div class="lib2-toolbar">
        <span id="dlStorage" style="font-size:12.5px;color:var(--text3)"></span>
      </div>
      <div id="dlList"></div>
    </div>
  </div>

  <!-- Barre d'actions groupées (mode sélection, audit §10.3) -->
  <div class="lib2-bulkbar hidden" id="libBulkBar">
    <span class="count" id="bulkCount">0 sélectionné(s)</span>
    <button class="btn btn-secondary btn-sm" id="bulkStatus">Statut…</button>
    <!-- Audit AMEL-33 : la categorie ne pouvait etre posee que serie par serie
         depuis la fiche ; ranger 358 series a la main n'est pas une option. -->
    <button class="btn btn-secondary btn-sm" id="bulkCategory">Catégorie…</button>
    <button class="btn btn-sm" id="bulkDelete" style="background:rgba(239,68,68,.15);color:#ef4444">Retirer</button>
    <button class="btn btn-sm" id="bulkCancel">Annuler</button>
  </div>

  </main>
  <div id="footer-slot"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/userdata.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/une-main.js"></script>
  <script src="assets/js/downloads.js"></script>
  <script src="assets/js/feuille.js"></script>
  <script src="assets/js/cartes-gestes.js"></script>
  <script src="assets/js/bibliotheque.js"></script>
  <script src="assets/js/card-hover.js"></script>
  <script src="assets/js/migration.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
