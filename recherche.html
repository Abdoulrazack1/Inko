<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Recherche</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .se-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .se-bar { display: flex; gap: 10px; margin-bottom: 8px; }
    .se-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 12px 16px; border-radius: 11px; font-size: 15px; }
    .se-input:focus { outline: none; border-color: var(--orange); }
    .se-go { background: var(--orange); color: #fff; border: none; padding: 0 22px; border-radius: 11px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .se-sub { font-size: 12.5px; color: var(--text3); margin-bottom: 22px; }
    .se-group { margin-bottom: 30px; }
    .se-ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .se-gname { font-family: var(--font-head); font-size: 17px; font-weight: 700; }
    .se-gtag { font-size: 10.5px; padding: 2px 8px; border-radius: 5px; background: var(--bg3); color: var(--text2); text-transform: uppercase; font-weight: 600; }
    .se-gcount { font-size: 12px; color: var(--text3); margin-left: auto; }
    .se-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    .se-card { cursor: pointer; }
    .se-cover { aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: var(--bg4); }
    .se-cover img { width: 100%; height: 100%; object-fit: cover; }
    .se-title { font-size: 12.5px; font-weight: 500; margin-top: 7px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .se-empty { color: var(--text3); font-size: 13px; padding: 6px 0; }
    .se-err { color: #ef4444; font-size: 12.5px; }
    .se-loading { text-align: center; padding: 60px; color: var(--text3); }
    .se-hist { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
    .se-hist-label { font-size:12px; color:var(--text3); margin-right:2px; }
    .se-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; background:var(--bg3); border:1px solid var(--border2); color:var(--text2); font-size:12.5px; cursor:pointer; transition:all .12s; }
    .se-chip:hover { color:var(--text); border-color:var(--orange); }
    .se-chip.on { background:var(--orange); border-color:var(--orange); color:#fff; }
    .se-chip .x { opacity:.5; font-size:14px; line-height:1; }
    .se-chip .x:hover { opacity:1; color:#ef4444; }
    .se-hist-clear { font-size:11.5px; color:var(--text3); cursor:pointer; background:none; border:none; text-decoration:underline; }
  </style>
</head>
<body class="page-body">
  <div id="header-slot"></div>
  <div class="se-wrap">
    <div class="se-bar">
      <input type="text" class="se-input" id="seInput" placeholder="Rechercher un manga sur toutes les sources…" autocomplete="off">
      <button class="se-go" id="seGo">Rechercher</button>
    </div>
    <div class="se-sub" id="seSub">Tape un titre : Inko cherche sur toutes tes sources installées en même temps.</div>
    <div class="se-hist" id="seHist" style="display:none"></div>
    <div id="seResults"></div>
  </div>
  <div id="footer-slot"></div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/userdata.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/nsfw.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/recherche.js"></script>
  <script src="assets/js/card-hover.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
