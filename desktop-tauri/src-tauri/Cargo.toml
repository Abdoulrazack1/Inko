[package]
name = "inko"
version = "2.3.4"
description = "Inko — lecteur de mangas, romans et livres"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` : l'app doit pouvoir vivre reduite quand elle sert de hub
# (audit AMEL-93). Sans lui, fermer la fenetre arrete le serveur pour les
# autres appareils de la maison.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
