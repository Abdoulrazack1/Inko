<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inko</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #111113; color: #e9e7e0;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }
  .boot { text-align: center; }
  .mark {
    width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .mark img { width: 100%; height: 100%; display: block; }
  .txt { font-size: 14px; color: #e9e7e0; letter-spacing: .02em; min-height: 20px; }
  .sub { font-size: 12px; color: #8d8a80; margin-top: 6px; min-height: 16px; }
  .bar { width: 220px; height: 4px; margin: 18px auto 0; background: rgba(233,231,224,.12); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #c1531b, #e07a3f); border-radius: 3px; transition: width .45s ease; }
  .pct { font-size: 11px; color: #6f6c63; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .err { color: #d98b7a; font-size: 12.5px; margin-top: 14px; max-width: 360px; display: none; line-height: 1.5; }
  /* Fenêtre sans bordure OS : le splash est déplaçable, avec une croix de secours */
  .tb-close-boot {
    position: fixed; top: 8px; right: 10px; width: 32px; height: 28px; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: #8d8a80; cursor: pointer; border-radius: 6px;
  }
  .tb-close-boot:hover { background: #e81123; color: #fff; }

  /* ── Pourquoi du mouvement ici, et pas de la décoration ──────
     Cet écran passe l'essentiel de son temps bloqué à 94 % : la barre est
     calée sur une HORLOGE, pas sur une progression réelle — le serveur ne
     peut rien dire de son avancement tant qu'il n'écoute pas. Une barre
     immobile à 94 % pendant vingt secondes se lit « c'est planté », et c'est
     ce qu'on nous rapportait.
     Ces trois animations ne décorent pas : elles répondent à la seule
     question que l'on se pose devant cet écran — est-ce que ça travaille
     encore ? */

  /* 1. La marque respire : la preuve de vie la plus discrète qui soit. */
  .mark { animation: respire 3.2s ease-in-out infinite; will-change: transform; }
  @keyframes respire {
    0%, 100% { transform: scale(1);     box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    50%      { transform: scale(1.035); box-shadow: 0 22px 60px rgba(193,83,27,.28); }
  }

  /* 2. Une lueur PARCOURT la barre, même quand sa largeur ne bouge plus.
        C'est elle qui distingue « ça avance lentement » de « c'est figé ». */
  .bar i { position: relative; overflow: hidden; }
  .bar i::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(-100%);
    animation: balaye 1.6s ease-in-out infinite;
  }
  @keyframes balaye { to { transform: translateX(100%); } }

  /* 3. Le texte d'étape se fond au lieu de sauter. */
  .txt, .sub { transition: opacity .28s ease; }
  .fondu { opacity: 0; }

  /* L'arrivée : la barre cesse de balayer et vire au vert. Le mouvement
     s'arrête AVEC la raison qui le justifiait. */
  body.pret .bar i::after { animation: none; opacity: 0; }
  body.pret .bar i { background: linear-gradient(90deg, #2f9e5e, #43c07a); }
  body.pret .mark { animation: none; transform: scale(1); }

  /* Certains utilisateurs souffrent de ces mouvements — nausée, vertige. La
     préférence système existe pour ça, et l'information reste entière sans
     l'animation. */
  @media (prefers-reduced-motion: reduce) {
    .mark, .bar i::after { animation: none; }
    .bar i::after { opacity: 0; }
    .txt, .sub { transition: none; }
  }
</style>
</head>
<body data-tauri-drag-region>
  <button class="tb-close-boot" id="bootClose" title="Fermer" aria-label="Fermer">
    <svg viewBox="0 0 12 12" width="12" height="12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.4"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <div class="boot">
    <div class="mark"><img src="logo.svg" alt="Inko"></div>
    <div class="txt" id="txt">Démarrage d'Inko…</div>
    <div class="sub" id="sub"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct"></div>
    <!-- Audit AMEL-94 : « le serveur ne démarre pas » ne dit pas QUOI a
         échoué. Trois causes très différentes produisaient le même message :
         le sidecar Node absent, la base injoignable, ou aucune extension
         chargée. On les distingue avec les endpoints qui existent déjà. -->
    <div class="err" id="err">
      <div id="errTitre" style="font-weight:600;color:#e9e7e0;margin-bottom:8px">Impossible de démarrer</div>
      <div id="diag" style="text-align:left;margin:0 auto 10px;max-width:340px"></div>
      <div id="errAide"></div>
    </div>
  </div>
<script>
  // Attend que le backend embarqué réponde, puis bascule sur l'app.
  // La barre est calibrée sur les durées réelles : ~5-10 s en usage normal,
  // ~30-60 s au tout premier lancement (initialisation de la base embarquée).
  const APP = 'http://127.0.0.1:8088';
  const t0 = Date.now();
  const txt  = document.getElementById('txt');
  const sub  = document.getElementById('sub');
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');

  // Étapes affichées selon le temps écoulé (le splash ne peut pas interroger
  // le serveur avant qu'il n'écoute : la pédagogie est calée sur l'horloge).
  const STEPS = [
    [0,   'Démarrage d’Inko…',                              ''],
    [3,   'Lancement du serveur…',                               ''],
    [9,   'Premier lancement : préparation de ta base de données…', 'Ça n’arrive qu’une seule fois — environ 30 secondes.'],
    [30,  'Installation presque terminée…',                      'Merci de patienter, c’est la dernière ligne droite.'],
    [60,  'Encore un instant…',                                  'Ton PC prend son temps, mais tout va bien.'],
  ];
  // Progression : rapide au début, asymptote à 94 % (100 % à la réponse du serveur)
  function progressFor(sec) {
    if (sec <= 6)  return sec / 6 * 45;                 // 0 → 45 %
    if (sec <= 30) return 45 + (sec - 6) / 24 * 35;     // 45 → 80 %
    if (sec <= 75) return 80 + (sec - 30) / 45 * 14;    // 80 → 94 %
    return 94;
  }
  // L'étape affichée en ce moment. Sans cette mémoire, le fondu se
  // redéclencherait à CHAQUE tick — soit toutes les 450 ms — et le texte
  // clignoterait au lieu de se fondre.
  let etapeAffichee = null;
  // Déclaré ICI, et pas plus bas avec `fini` : `tick()` s'exécute dès la ligne
  // qui suit `setInterval`, donc AVANT les déclarations de la boucle d'attente.
  // Lire `fini` depuis ce fondu lèverait une ReferenceError de zone morte au
  // tout premier tick — un écran vide définitif, soit pire que le blocage
  // qu'on corrige.
  let bascule = false;
  function poserEtape(step) {
    if (bascule) return;
    if (etapeAffichee === step) return;
    const premiere = etapeAffichee === null;
    etapeAffichee = step;
    const ecrire = () => {
      // Un fondu déjà programmé ne doit pas écraser « C'est prêt ! » : le
      // serveur a pu répondre pendant ces 280 ms.
      if (bascule) return;
      txt.textContent = step[1];
      sub.textContent = step[2];
      txt.classList.remove('fondu'); sub.classList.remove('fondu');
    };
    if (premiere) return ecrire();     // rien à fondre au premier affichage
    txt.classList.add('fondu'); sub.classList.add('fondu');
    setTimeout(ecrire, 280);           // la durée de la transition CSS
  }

  function tick() {
    const sec = (Date.now() - t0) / 1000;
    let step = STEPS[0];
    for (const s of STEPS) if (sec >= s[0]) step = s;
    poserEtape(step);
    const p = progressFor(sec);
    fill.style.width = p.toFixed(1) + '%';
    // Estimation honnête du temps restant (budget premier lancement : 45 s)
    if (sec > 8) {
      const left = Math.max(5, Math.round(45 - sec));
      pct.textContent = sec < 70 ? Math.round(p) + ' % · ≈ ' + left + ' s restantes' : Math.round(p) + ' %';
    } else {
      pct.textContent = Math.round(p) + ' %';
    }
  }
  const clock = setInterval(tick, 450);
  tick();

  // Croix de secours (fenêtre sans bordure) : ferme proprement pendant le boot
  document.getElementById('bootClose').onclick = () => {
    try {
      const T = window.__TAURI__;
      const w = T && T.window && (T.window.getCurrentWindow || T.window.getCurrent).call(T.window);
      if (w) w.close(); else window.close();
    } catch (e) { window.close(); }
  };

  // ── Une sonde SANS délai pouvait figer le démarrage pour toujours ──
  //
  // `fetch` n'abandonne pas tout seul. Quand le serveur accepte la connexion
  // mais ne répond pas — base embarquée encore en train de s'initialiser,
  // sidecar à moitié levé — la promesse ne se règle JAMAIS : ni `done()`, ni
  // `retry()`. Et comme `tries` n'avance que dans `retry()`, la limite des 300
  // essais n'était jamais atteinte : le diagnostic ne s'affichait pas, la
  // barre montait à 94 % et y restait. Un écran de démarrage éternel, sans un
  // mot.
  //
  // Six secondes par sonde : largement au-dessus d'un `/api/health` local, qui
  // répond en millisecondes dès qu'il écoute. Au-delà, ce n'est plus de la
  // lenteur, c'est une connexion qui ne reviendra pas — on relance.
  const DELAI_SONDE = 6000;
  function sonder() {
    if (typeof AbortController !== 'function') {
      return fetch(APP + '/api/health', { cache: 'no-store' });
    }
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => ctrl.abort(), DELAI_SONDE);
    return fetch(APP + '/api/health', { cache: 'no-store', signal: ctrl.signal })
      .finally(() => clearTimeout(minuteur));
  }

  let tries = 0;
  let fini = false;          // `done()` ne doit basculer qu'une fois
  (function poll() {
    sonder()
      // `retry` n'est appelé QUE sur l'échec de la sonde. Avant, un `.catch`
      // unique couvrait aussi `done()` : la moindre erreur pendant la bascule
      // relançait l'attente en silence, au lieu de la signaler.
      .then(r => { if (r.ok) done(); else retry(); }, retry);
    function done() {
      if (fini) return;
      fini = true;
      // La bascule est programmée AVANT les retouches d'affichage : le serveur
      // répond, donc l'app doit s'ouvrir même si une de ces lignes échoue.
      // Faire l'inverse ferait dépendre le démarrage de la décoration.
      setTimeout(() => location.replace(APP + '/accueil.html'), 350);
      try {
        bascule = true;          // neutralise un fondu encore en attente
        clearInterval(clock);
        document.body.classList.add('pret');
        txt.textContent = 'C’est prêt !';
        sub.textContent = '';
        fill.style.width = '100%';
        pct.textContent = '100 %';
      } catch (e) { /* l'ouverture est déjà programmée */ }
    }
    function retry() {
      if (++tries > 300) {   // ~150 s : marge large pour les PC lents
        clearInterval(clock);
        txt.textContent = 'Impossible de démarrer';
        sub.textContent = '';
        pct.textContent = '';
        diagnostiquer();
        return;
      }
      setTimeout(poll, 500);
    }
  })();

  // ── Diagnostic de démarrage (audit AMEL-94) ─────────────────
  // Trois causes produisaient le même écran : le sidecar Node qui n'a pas
  // démarré, la base injoignable, ou aucune extension chargée. Les distinguer
  // change complètement ce qu'il y a à faire — et /api/health sait déjà le
  // dire (il renvoie 503 avec `db: "down"` quand seule la base manque).
  async function diagnostiquer() {
    const zone = document.getElementById('diag');
    const aide = document.getElementById('errAide');
    document.getElementById('err').style.display = 'block';
    const ligne = (etat, quoi, detail) => {
      const c = etat === 'ok' ? '#7ee2a0' : etat === 'warn' ? '#ffc766' : '#ff9d9d';
      const s = etat === 'ok' ? '✓' : etat === 'warn' ? '!' : '✕';
      return `<div style="display:flex;gap:8px;padding:3px 0;font-size:12.5px">
        <span style="color:${c};flex:0 0 12px">${s}</span>
        <span style="color:#e9e7e0">${quoi}</span>
        <span style="color:#8d8a80;margin-left:auto;text-align:right">${detail || ''}</span></div>`;
    };

    let sante = null, statut = 0;
    try {
      const r = await fetch(APP + '/api/health', { cache: 'no-store' });
      statut = r.status;
      sante = await r.json().catch(() => null);
    } catch (e) { statut = 0; }

    if (statut === 0) {
      // Rien ne répond : le serveur Node n'écoute pas. C'est la seule cause
      // qu'on ne peut PAS raffiner depuis ici — le journal, lui, le peut.
      zone.innerHTML = ligne('err', 'Serveur interne', 'ne répond pas')
        + ligne('warn', 'Base de données', 'non vérifiable')
        + ligne('warn', 'Extensions', 'non vérifiables');
      aide.innerHTML = 'Le serveur embarqué n’a pas démarré. Ferme Inko et relance-le. '
        + 'Si ça se reproduit, le journal détaillé est dans <b>%TEMP%\\inko-tauri.log</b> — '
        + 'il contient la ligne exacte qui a échoué.';
      return;
    }

    const baseOk = !!(sante && sante.db === 'up');
    let sources = null;
    try { sources = await (await fetch(APP + '/api/sources', { cache: 'no-store' })).json(); } catch (e) { sources = null; }

    zone.innerHTML = ligne('ok', 'Serveur interne', 'démarré')
      + ligne(baseOk ? 'ok' : 'err', 'Base de données', baseOk ? 'connectée' : (sante && sante.error) || 'injoignable')
      + ligne(Array.isArray(sources) && sources.length ? 'ok' : 'warn', 'Extensions',
              Array.isArray(sources) ? `${sources.length} chargée(s)` : 'non vérifiables');

    if (!baseOk) {
      aide.innerHTML = 'Le serveur tourne mais la base embarquée ne répond pas. '
        + 'C’est presque toujours une base restée verrouillée par une instance précédente : '
        + 'ferme Inko, attends dix secondes, relance. '
        + 'Journal : <b>%TEMP%\\inko-tauri.log</b>.';
    } else if (Array.isArray(sources) && !sources.length) {
      aide.innerHTML = 'Aucune source de lecture n’est chargée : l’app démarrerait sur un catalogue vide. '
        + 'Réinstalle Inko pour restaurer les extensions.';
    } else {
      // Tout répond mais la page n'a pas basculé : le blocage est ailleurs.
      aide.innerHTML = 'Tout semble en ordre côté serveur. Relance Inko ; '
        + 'si l’écran reste bloqué, signale-le avec <b>%TEMP%\\inko-tauri.log</b>.';
    }
  }
</script>
</body>
</html>
