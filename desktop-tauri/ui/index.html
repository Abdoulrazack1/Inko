<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inko</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #111113; color: #e9e7e0;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }
  .boot { text-align: center; }
  .mark {
    width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .mark img { width: 100%; height: 100%; display: block; }
  .txt { font-size: 14px; color: #e9e7e0; letter-spacing: .02em; min-height: 20px; }
  .sub { font-size: 12px; color: #8d8a80; margin-top: 6px; min-height: 16px; }
  .bar { width: 220px; height: 4px; margin: 18px auto 0; background: rgba(233,231,224,.12); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #c1531b, #e07a3f); border-radius: 3px; transition: width .45s ease; }
  .pct { font-size: 11px; color: #6f6c63; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .err { color: #d98b7a; font-size: 12.5px; margin-top: 14px; max-width: 360px; display: none; line-height: 1.5; }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark"><img src="logo.svg" alt="Inko"></div>
    <div class="txt" id="txt">Démarrage d'Inko…</div>
    <div class="sub" id="sub"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct"></div>
    <div class="err" id="err">Le serveur interne ne démarre pas. Ferme Inko, relance-le,
      et si le problème persiste, signale-le sur
      github.com/Abdoulrazack1/Inko (le journal est dans %TEMP%\inko-tauri.log).</div>
  </div>
<script>
  // Attend que le backend embarqué réponde, puis bascule sur l'app.
  // La barre est calibrée sur les durées réelles : ~5-10 s en usage normal,
  // ~30-60 s au tout premier lancement (initialisation de la base embarquée).
  const APP = 'http://127.0.0.1:8088';
  const t0 = Date.now();
  const txt  = document.getElementById('txt');
  const sub  = document.getElementById('sub');
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');

  // Étapes affichées selon le temps écoulé (le splash ne peut pas interroger
  // le serveur avant qu'il n'écoute : la pédagogie est calée sur l'horloge).
  const STEPS = [
    [0,   'Démarrage d’Inko…',                              ''],
    [3,   'Lancement du serveur…',                               ''],
    [9,   'Premier lancement : préparation de ta base de données…', 'Ça n’arrive qu’une seule fois — environ 30 secondes.'],
    [30,  'Installation presque terminée…',                      'Merci de patienter, c’est la dernière ligne droite.'],
    [60,  'Encore un instant…',                                  'Ton PC prend son temps, mais tout va bien.'],
  ];
  // Progression : rapide au début, asymptote à 94 % (100 % à la réponse du serveur)
  function progressFor(sec) {
    if (sec <= 6)  return sec / 6 * 45;                 // 0 → 45 %
    if (sec <= 30) return 45 + (sec - 6) / 24 * 35;     // 45 → 80 %
    if (sec <= 75) return 80 + (sec - 30) / 45 * 14;    // 80 → 94 %
    return 94;
  }
  function tick() {
    const sec = (Date.now() - t0) / 1000;
    let step = STEPS[0];
    for (const s of STEPS) if (sec >= s[0]) step = s;
    txt.textContent = step[1];
    sub.textContent = step[2];
    const p = progressFor(sec);
    fill.style.width = p.toFixed(1) + '%';
    // Estimation honnête du temps restant (budget premier lancement : 45 s)
    if (sec > 8) {
      const left = Math.max(5, Math.round(45 - sec));
      pct.textContent = sec < 70 ? Math.round(p) + ' % · ≈ ' + left + ' s restantes' : Math.round(p) + ' %';
    } else {
      pct.textContent = Math.round(p) + ' %';
    }
  }
  const clock = setInterval(tick, 450);
  tick();

  let tries = 0;
  (function poll() {
    fetch(APP + '/api/health', { cache: 'no-store' })
      .then(r => r.ok ? done() : retry())
      .catch(retry);
    function done() {
      clearInterval(clock);
      txt.textContent = 'C’est prêt !';
      sub.textContent = '';
      fill.style.width = '100%';
      pct.textContent = '100 %';
      setTimeout(() => location.replace(APP + '/accueil.html'), 350);
    }
    function retry() {
      if (++tries > 300) {   // ~150 s : marge large pour les PC lents
        clearInterval(clock);
        document.getElementById('err').style.display = 'block';
        txt.textContent = 'Impossible de démarrer';
        sub.textContent = '';
        pct.textContent = '';
        return;
      }
      setTimeout(poll, 500);
    }
  })();
</script>
</body>
</html>
