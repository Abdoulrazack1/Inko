<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inko</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #111113; color: #e9e7e0;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }
  .boot { text-align: center; }
  .mark {
    width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .mark img { width: 100%; height: 100%; display: block; }
  .txt { font-size: 14px; color: #b2afa5; letter-spacing: .02em; }
  .bar { width: 180px; height: 3px; margin: 18px auto 0; background: rgba(233,231,224,.12); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: #c1531b; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .err { color: #d98b7a; font-size: 12.5px; margin-top: 14px; max-width: 340px; display: none; line-height: 1.5; }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark"><img src="logo.svg" alt="Inko"></div>
    <div class="txt" id="txt">Démarrage d'Inko…</div>
    <div class="bar"><i></i></div>
    <div class="err" id="err">Le serveur ne démarre pas. Vérifie que MySQL tourne
      (Laragon, MAMP…) sur 127.0.0.1:3306, puis relance Inko.</div>
  </div>
<script>
  // Attend que le backend embarqué réponde, puis bascule sur l'app.
  const APP = 'http://127.0.0.1:8088';
  let tries = 0;
  (function poll() {
    fetch(APP + '/api/health', { cache: 'no-store' })
      .then(r => r.ok ? location.replace(APP + '/accueil.html') : retry())
      .catch(retry);
    function retry() {
      if (++tries > 120) {   // ~60 s
        document.getElementById('err').style.display = 'block';
        document.getElementById('txt').textContent = 'Impossible de joindre le serveur';
        return;
      }
      setTimeout(poll, 500);
    }
  })();
</script>
</body>
</html>
