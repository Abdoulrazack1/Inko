  <title>Inko — Journal de lecture</title>
  <!-- meta:auto -->
    <meta name="description" content="Ton journal de lecture : tes impressions, chapitre après chapitre.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Inko">
    <meta property="og:title" content="Inko — Journal de lecture">
    <meta property="og:description" content="Ton journal de lecture : tes impressions, chapitre après chapitre.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Inko — Journal de lecture">

</head>
<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">

  <div class="jr-wrap">
    <div class="jr-head">
      <h1>Journal de lecture</h1>
      <div class="jr-sub">Tes pensées, chapitre après chapitre — comme un carnet qui suit ta lecture.</div>
      <div class="jr-stats" id="jrStats"></div>
    <!-- Audit AMEL-46 : le champ « humeur » etait collecte a chaque note et
         restitue par UNE valeur dominante ; l'evolution etait perdue. -->
    <div class="jr-moods" id="jrMoods" hidden></div>
    </div>
    <div class="jr-toolbar">
      <input type="text" class="jr-search" id="jrSearch" placeholder="Rechercher dans mes notes…" autocomplete="off" aria-label="Rechercher dans mes notes">
      <!-- Audit AMEL-45 : relire son journal comme un recit demande l'ordre
           chronologique ; la consultation courante veut le plus recent. -->
      <button class="btn btn-secondary btn-sm" id="jrRecit" aria-pressed="false" title="Lire chaque série du début à la fin">Mode récit</button>
      <!-- Audit AMEL-43 : l'export global est du JSON, fait pour etre reimporte,
           pas pour etre lu. Une note de lecture s'ouvre dans un carnet. -->
      <button class="btn btn-secondary btn-sm" id="jrExportMd" title="Exporter en Markdown (Obsidian, Logseq…)">Export Markdown</button>
    </div>

    <!-- Filtrer par humeur et par série.
         La frise des humeurs montrait « 3 notes émouvantes en mars » sans
         qu'on puisse les ouvrir, et retrouver ses notes sur une série
         demandait d'en taper le titre. Deux questions courantes, aucune
         réponse. Les deux listes sont construites à partir des notes
         RÉELLES : proposer une humeur que personne n'a jamais posée
         reviendrait à offrir un filtre qui ne rend jamais rien. -->
    <div class="jr-filtres" id="jrFiltres" hidden>
      <div class="jr-filtres-humeurs" id="jrFiltreHumeurs" role="group" aria-label="Filtrer par humeur"></div>
      <label class="jr-filtre-serie">
        <span class="visually-hidden">Filtrer par série</span>
        <select id="jrFiltreSerie" aria-label="Filtrer par série"></select>
      </label>
      <button type="button" class="btn btn-ghost btn-sm" id="jrFiltresRaz" hidden>Tout afficher</button>
    </div>
    <div id="jrBody">
      <div class="jr-empty"><div class="spinner-inline"></div></div>
    </div>
  </div>

  </main>
  <div id="footer-slot"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/une-main.js"></script>
  <script src="assets/js/tirer-rafraichir.js"></script>
  <!-- `notes-ui.js` est le module du panneau de notes DANS le lecteur.
       Il est chargé ici pour sa seule table `MOODS`, dont la page a
       besoin pour filtrer par humeur. La recopier ici ferait deux
       listes à tenir à jour, et une pastille « Émouvant » bleue dans le
       journal et rouge dans le lecteur seraient deux objets différents.
       Le module n'a aucun effet au chargement : il n'expose que des
       fonctions, et n'insère son panneau qu'au premier `open()`. -->
  <script src="assets/js/notes-ui.js"></script>
  <script src="assets/js/notes.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
