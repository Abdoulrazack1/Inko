<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Inko Music</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <style>
    :root{ --bg:#0d0d0f; --bg2:#16161a; --bg3:#1f1f26; --or:#ff6b1a; --tx:#f0f0f2; --tx2:#a8a8b3; --bd:rgba(255,255,255,.1); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg2)}
    .ph .logo{width:22px;height:22px;border-radius:6px}
    .ph h1{font-size:14px;font-weight:700}
    .tabs{display:flex;gap:3px;padding:8px;background:var(--bg2);border-bottom:1px solid var(--bd)}
    .tab{flex:1;padding:7px;border:none;background:var(--bg3);color:var(--tx2);border-radius:7px;font-size:12px;cursor:pointer;font-weight:500}
    .tab.active{background:var(--or);color:#fff}
    .body{flex:1;overflow:auto;padding:14px}
    .panel{display:none}
    .panel.active{display:block}
    input,button{font-family:inherit}
    .inp{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);padding:9px 11px;border-radius:8px;font-size:12.5px;margin-bottom:8px}
    .inp:focus{outline:none;border-color:var(--or)}
    .btn{background:var(--or);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;width:100%}
    .btn.sec{background:var(--bg3);color:var(--tx)}
    .hint{font-size:11px;color:var(--tx2);line-height:1.5;margin-bottom:10px}
    iframe{width:100%;border:none;border-radius:10px}
    /* Local player */
    .np{text-align:center;padding:10px 0 6px}
    .np-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .np-sub{font-size:11px;color:var(--tx2);margin-top:2px}
    .ctrls{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
    .ctrls button{background:none;border:none;color:var(--tx);font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:50%}
    .ctrls .play{background:var(--or);color:#fff;font-size:18px}
    .seek{width:100%;accent-color:var(--or)}
    .times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx2);margin-top:2px}
    .pl{margin-top:12px;max-height:200px;overflow:auto}
    .pl-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12px}
    .pl-item:hover{background:var(--bg3)}
    .pl-item.cur{background:var(--bg3);color:var(--or);font-weight:600}
    .pl-item .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vol{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
  </style>
</head>
<body>
  <div class="ph">
    <img src="/assets/img/icon.svg" class="logo" alt="">
    <h1>Inko Music</h1>
    <span style="margin-left:auto;font-size:10px;color:var(--tx2)">reste ouvert en lisant</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="local">📁 Mes fichiers</button>
    <button class="tab" data-tab="spotify">🟢 Spotify</button>
    <button class="tab" data-tab="youtube">▶️ YouTube</button>
  </div>

  <div class="body">
    <!-- LOCAL -->
    <div class="panel active" id="p-local">
      <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
      <button class="btn sec" id="pickBtn" style="margin-bottom:12px">＋ Choisir des fichiers audio</button>
      <div id="localPlayer" style="display:none">
        <div class="np">
          <div class="np-title" id="npTitle">—</div>
          <div class="np-sub" id="npSub"></div>
        </div>
        <input type="range" class="seek" id="seek" value="0" min="0" max="100" step="0.1">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
        <div class="ctrls">
          <button id="prev">⏮</button>
          <button class="play" id="play">▶</button>
          <button id="next">⏭</button>
          <button id="loop" title="Répéter">🔁</button>
        </div>
        <div class="vol">🔉<input type="range" class="seek" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
        <div class="pl" id="playlist"></div>
      </div>
    </div>

    <!-- SPOTIFY -->
    <div class="panel" id="p-spotify">
      <div class="hint">Colle un lien Spotify (playlist, album, titre ou podcast). Le lecteur s'intègre directement.</div>
      <input class="inp" id="spotifyUrl" placeholder="https://open.spotify.com/playlist/...">
      <button class="btn" id="spotifyLoad">Charger</button>
      <div id="spotifyEmbed" style="margin-top:12px"></div>
    </div>

    <!-- YOUTUBE -->
    <div class="panel" id="p-youtube">
      <div class="hint">Colle un lien YouTube (vidéo ou playlist) pour écouter en fond.</div>
      <input class="inp" id="ytUrl" placeholder="https://youtube.com/watch?v=...">
      <button class="btn" id="ytLoad">Charger</button>
      <div id="ytEmbed" style="margin-top:12px"></div>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="assets/js/player.js"></script>
</body>
</html>
