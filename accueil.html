<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">
  <!--
    Accueil refait autour d'une seule question : « qu'est-ce que je lis
    maintenant ? ». Dans l'ordre : la lecture en cours, les nouveaux chapitres
    de ce que je suis, ce que j'ai mis de côté, puis seulement la découverte.
    L'ancien carrousel mettait en avant la dernière série parue sur la source
    — n'importe laquelle, contenu adulte compris — au-dessus de tout le reste.
  -->
  <div class="home container">
    <header class="home-head">
      <div>
        <!-- Le titre de la page reste « Accueil » pour les lecteurs d'écran ;
             la salutation n'en est que la partie visible. -->
        <h1 class="home-hello"><span class="a11y-invisible">Accueil — </span><span id="homeHello">Bonjour</span></h1>
        <p class="home-sub" id="homeSub"></p>
      </div>
      <ul class="home-chiffres" id="homeStats"></ul>
    </header>

    <section class="home-continue" id="homeContinue" aria-label="Reprendre la lecture"></section>

    <section class="shelf" id="shelfNew" hidden>
      <div class="shelf-head">
        <div><h2 class="shelf-title">Nouveaux chapitres</h2><p class="shelf-sub" id="shelfNewSub">Dans les séries que tu suis</p></div>
        <div class="shelf-actions">
          <button class="shelf-link" id="homeCheck" type="button">Vérifier maintenant</button>
          <a class="shelf-link" href="bibliotheque.html">Ma bibliothèque →</a>
        </div>
      </div>
      <div class="shelf-track" id="shelfNewTrack"></div>
    </section>

    <section class="shelf shelf--pile" id="shelfFile" hidden>
      <div class="shelf-head"><div><h2 class="shelf-title">À lire ensuite</h2><p class="shelf-sub">Ce que tu as mis de côté</p></div></div>
      <div class="shelf-track" id="shelfFileTrack"></div>
    </section>

    <!-- Trois rangées de couvertures qui se suivaient, de même taille, au
         même rythme, sous trois titres : la page comptait cinq rangées
         identiques et on ne les distinguait plus. Elles n’appellent pas
         trois sections, elles appellent trois ENTRÉES dans la même. -->
    <section class="shelf decouvrir" id="shelfDecouvrir">
      <div class="shelf-head">
        <div>
          <h2 class="shelf-title">Découvrir</h2>
          <p class="shelf-sub" id="shelfDecouvrirSub"></p>
        </div>
        <a class="shelf-link" id="decouvrirLien" href="catalogue.html">Catalogue →</a>
      </div>
      <div class="decouvrir-onglets" role="tablist" aria-label="Que découvrir">
        <button class="decouvrir-onglet" type="button" role="tab" id="ongletReco"
                aria-controls="shelfRecoTrack" aria-selected="false" hidden>Pour toi</button>
        <button class="decouvrir-onglet on" type="button" role="tab" id="ongletPopular"
                aria-controls="shelfPopularTrack" aria-selected="true">Populaire</button>
        <button class="decouvrir-onglet" type="button" role="tab" id="ongletLatest"
                aria-controls="shelfLatestTrack" aria-selected="false">Dernières sorties</button>
      </div>
      <div class="shelf-track" id="shelfRecoTrack" role="tabpanel" aria-labelledby="ongletReco" hidden></div>
      <div class="shelf-track" id="shelfPopularTrack" role="tabpanel" aria-labelledby="ongletPopular"></div>
      <div class="shelf-track" id="shelfLatestTrack" role="tabpanel" aria-labelledby="ongletLatest" hidden></div>
    </section>
  </div>
  </main>
  <div id="footer-slot"></div>
