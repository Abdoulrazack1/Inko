<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">
  <!--
    Accueil refait autour d'une seule question : « qu'est-ce que je lis
    maintenant ? ». Dans l'ordre : la lecture en cours, les nouveaux chapitres
    de ce que je suis, ce que j'ai mis de côté, puis seulement la découverte.
    L'ancien carrousel mettait en avant la dernière série parue sur la source
    — n'importe laquelle, contenu adulte compris — au-dessus de tout le reste.
  -->
  <div class="home container">
    <header class="home-head">
      <div>
        <!-- Le titre de la page reste « Accueil » pour les lecteurs d'écran ;
             la salutation n'en est que la partie visible. -->
        <h1 class="home-hello"><span class="a11y-invisible">Accueil — </span><span id="homeHello">Bonjour</span></h1>
        <p class="home-sub" id="homeSub"></p>
      </div>
      <div class="home-stats" id="homeStats"></div>
    </header>

    <section class="home-continue" id="homeContinue" aria-label="Reprendre la lecture"></section>

    <section class="shelf" id="shelfNew" hidden>
      <div class="shelf-head">
        <div><h2 class="shelf-title">Nouveaux chapitres</h2><p class="shelf-sub" id="shelfNewSub">Dans les séries que tu suis</p></div>
        <div class="shelf-actions">
          <button class="shelf-link" id="homeCheck" type="button">Vérifier maintenant</button>
          <a class="shelf-link" href="bibliotheque.html">Ma bibliothèque →</a>
        </div>
      </div>
      <div class="shelf-track" id="shelfNewTrack"></div>
    </section>

    <section class="shelf" id="shelfFile" hidden>
      <div class="shelf-head"><div><h2 class="shelf-title">À lire ensuite</h2><p class="shelf-sub">Ce que tu as mis de côté</p></div></div>
      <div class="shelf-track" id="shelfFileTrack"></div>
    </section>

    <section class="shelf" id="shelfReco" hidden>
      <div class="shelf-head"><div><h2 class="shelf-title">Recommandé pour toi</h2><p class="shelf-sub" id="shelfRecoSub"></p></div></div>
      <div class="shelf-track" id="shelfRecoTrack"></div>
    </section>

    <section class="shelf" id="shelfPopular">
      <div class="shelf-head">
        <div><h2 class="shelf-title">Populaire</h2><p class="shelf-sub" id="shelfPopularSub"></p></div>
        <a class="shelf-link" href="catalogue.html">Catalogue →</a>
      </div>
      <div class="shelf-track" id="shelfPopularTrack"></div>
    </section>

    <section class="shelf" id="shelfLatest">
      <div class="shelf-head">
        <div><h2 class="shelf-title">Dernières sorties</h2><p class="shelf-sub" id="shelfLatestSub"></p></div>
        <a class="shelf-link" href="catalogue.html?sort=latest">Tout voir →</a>
      </div>
      <div class="shelf-track" id="shelfLatestTrack"></div>
    </section>
  </div>
  </main>
  <div id="footer-slot"></div>
