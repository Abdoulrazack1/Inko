apply plugin: 'com.android.application'

// ── VIII.19 : la version vient de package.json, pas d'ici ───
// Deux numéros de version tenus à la main divergent — c'est une question de
// temps, pas de discipline. Celui-ci est DÉRIVÉ de `package.json`, seule
// source de vérité du projet.
//
// `versionCode` doit être un entier monotone : Android refuse d'installer une
// mise à jour dont le code est inférieur ou égal. « 2.5.8 » devient 20508, ce
// qui laisse 100 correctifs et 100 mineures par majeure.
def paquet = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def versionLue = paquet.version as String
def bouts = versionLue.tokenize('.')
def codeCalcule = (bouts[0] as int) * 10000 + (bouts[1] as int) * 100 + (bouts[2] as int)

android {
    namespace "app.inko.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.inko.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codeCalcule
        versionName versionLue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ── Signature de publication ────────────────────────────
    // Le keystore n'est PAS dans le dépôt : il arrive par variables
    // d'environnement, remplies depuis les secrets GitHub. Sans elles, la
    // configuration est absente et Gradle construit un APK non signé — ce qui
    // permet de compiler la variante `release` sans détenir la clé.
    //
    // ⚠ Le keystore doit être sauvegardé HORS du dépôt ET hors de la machine
    // de build. Le perdre signifie qu'aucune installation existante ne pourra
    // plus être mise à jour. Jamais. Android identifie une app par sa
    // signature : une nouvelle clé est une nouvelle app.
    signingConfigs {
        release {
            if (System.getenv('INKO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('INKO_KEYSTORE_PATH'))
                storePassword System.getenv('INKO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('INKO_KEY_ALIAS')
                keyPassword System.getenv('INKO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('INKO_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // P2.5 sans Firebase : `WorkManager` reveille l'app au plus toutes les
    // quinze minutes pour demander au hub s'il y a du neuf. C'est la seule
    // facon sanctionnee par Android de faire du travail periodique qui survive
    // au mode Doze et au redemarrage — et elle ne depend d'aucun service Google.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
