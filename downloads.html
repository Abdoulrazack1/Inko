<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Téléchargements</title>
  <!-- meta:auto -->
    <meta name="description" content="Tes chapitres téléchargés, disponibles hors connexion.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Inko">
    <meta property="og:title" content="Inko — Téléchargements">
    <meta property="og:description" content="Tes chapitres téléchargés, disponibles hors connexion.">
    <meta property="og:image" content="/assets/img/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Inko — Téléchargements">
    <meta name="twitter:description" content="Tes chapitres téléchargés, disponibles hors connexion.">
    <!-- meta:auto -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .dl-prechauffe { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text2); margin: 6px 0 10px; cursor: pointer; }
    .dl-prechauffe-note { display: block; font-size: 12px; color: var(--text3); }
    .dl-budget { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--text2); margin: 6px 0 14px; }
    .dl-budget select { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 4px 8px; }
    .dl-budget-note { flex-basis: 100%; font-size: 12px; color: var(--text3); }
    .dl-wrap { max-width: 880px; margin: 0 auto; padding: 26px 20px 80px; }
    .dl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    .dl-head h1 { font-family: var(--font-head); font-size: 27px; font-weight: 700; }
    .dl-sub { color: var(--text2); font-size: 13px; margin-bottom: 22px; }
    .dl-bar { height: 8px; border-radius: 5px; background: var(--bg4); overflow: hidden; margin: 6px 0 24px; }
    .dl-bar > div { height: 100%; background: linear-gradient(90deg,#ff8c42,var(--orange)); }
    .dl-group { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .dl-ghead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .dl-gcover { width: 38px; height: 52px; border-radius: 6px; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
    .dl-gtitle { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; }
    .dl-gcount { font-size: 11.5px; color: var(--text3); }
    .dl-chap { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); font-size: 13px; }
    .dl-chap:first-child { border-top: none; }
    .dl-chap .grow { flex: 1; min-width: 0; }
    .dl-empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: var(--bg4); color: var(--text2); text-transform: uppercase; }
  </style>
</head>
<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">
  <div class="dl-wrap">
    <div class="dl-head">
      <h1>Téléchargements</h1>
      <button class="btn btn-secondary btn-sm" id="dlPurge" hidden title="Supprimer d'abord ce qui est déjà lu, jamais ce qui reste à lire">Libérer de la place</button>
      <button class="btn btn-sm" id="dlClearAll" style="display:none;color:#ef4444">Tout supprimer</button>
    </div>
    <div class="dl-sub" id="dlStorage">Chapitres disponibles hors-ligne (stockés sur cet appareil).</div>
    <label class="dl-prechauffe"><input type="checkbox" id="dlPrechauffe">
      <span>Préparer les prochains chapitres sur secteur et en Wi-Fi
        <span class="dl-prechauffe-note">Les deux chapitres qui suivent ta position, pour tes cinq séries en cours. Jamais sur le réseau mobile.</span></span>
    </label>
    <label class="dl-budget">Plafond de stockage
      <select id="dlBudget" aria-describedby="dlBudgetNote">
        <option value="0">Aucun</option>
        <option value="524288000">500 Mo</option>
        <option value="1073741824">1 Go</option>
        <option value="2147483648">2 Go</option>
        <option value="5368709120">5 Go</option>
      </select>
      <span class="dl-budget-note" id="dlBudgetNote">Au-delà, les plus anciens chapitres déjà lus partent d’eux-mêmes. Jamais ce qui reste à lire.</span>
    </label>
    <div class="dl-bar" id="dlBar" style="display:none"><div></div></div>
    <div id="dlQueue"></div>
    <div id="dlBody"><div class="dl-empty"><div class="spinner-inline"></div></div></div>
  </div>
  </main>
  <div id="footer-slot"></div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/une-main.js"></script>
  <script src="assets/js/tirer-rafraichir.js"></script>
  <script src="assets/vendor/jszip.min.js"></script>
  <script src="assets/js/downloads.js"></script>
  <script src="assets/js/dl-file.js"></script>
  <script src="assets/js/prechauffe.js"></script>
  <script src="assets/js/downloads-page.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
