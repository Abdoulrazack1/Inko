<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">
  <div class="dl-wrap">
    <div class="dl-head">
      <h1>Téléchargements</h1>
      <button class="btn btn-secondary btn-sm" id="dlPurge" hidden title="Supprimer d'abord ce qui est déjà lu, jamais ce qui reste à lire">Libérer de la place</button>
      <button class="btn btn-sm" id="dlClearAll" style="display:none;color:#ef4444">Tout supprimer</button>
    </div>
    <div class="dl-sub" id="dlStorage">Chapitres disponibles hors-ligne (stockés sur cet appareil).</div>
    <label class="dl-prechauffe"><input type="checkbox" id="dlPrechauffe">
      <span>Préparer les prochains chapitres sur secteur et en Wi-Fi
        <span class="dl-prechauffe-note">Les deux chapitres qui suivent ta position, pour tes cinq séries en cours. Jamais sur le réseau mobile.</span></span>
    </label>
    <label class="dl-budget">Plafond de stockage
      <select id="dlBudget" aria-describedby="dlBudgetNote">
        <option value="0">Aucun</option>
        <option value="524288000">500 Mo</option>
        <option value="1073741824">1 Go</option>
        <option value="2147483648">2 Go</option>
        <option value="5368709120">5 Go</option>
      </select>
      <span class="dl-budget-note" id="dlBudgetNote">Au-delà, les plus anciens chapitres déjà lus partent d’eux-mêmes. Jamais ce qui reste à lire.</span>
    </label>
    <div class="dl-bar" id="dlBar" style="display:none"><div></div></div>
    <div id="dlQueue"></div>
    <div id="dlBody"><div class="dl-empty"><div class="spinner-inline"></div></div></div>
  </div>
