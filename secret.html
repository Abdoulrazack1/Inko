<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/catalogue.css">
  <style>
    .lock-screen {
      min-height: 70vh; display: flex; align-items: center; justify-content: center;
    }
    .lock-box {
      background: var(--bg2); border: 1px solid rgba(236,72,153,.25);
      border-radius: 16px; padding: 40px; text-align: center; max-width: 360px; width: 100%;
    }
    .lock-icon { font-size: 48px; margin-bottom: 12px; }
    .lock-box h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .lock-box p  { color: var(--text2); font-size: 13px; margin-bottom: 22px; }
    .lock-pin {
      background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
      padding: 14px; border-radius: 10px; font-size: 22px; text-align: center;
      letter-spacing: 8px; width: 100%; margin-bottom: 16px;
    }
    .lock-pin:focus { outline: none; border-color: #ec4899; }
    .secret-banner {
      background: rgba(236,72,153,.08); border-bottom: 1px solid rgba(236,72,153,.2);
      padding: 10px 0; text-align: center; font-size: 12px; color: #ec4899;
    }
    .nsfw-cover { filter: none; }
  </style>
</head>
<body class="page-body">
  <div id="header-slot"></div>

  <!-- Écran de verrouillage -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <div class="lock-icon">🔞</div>
      <h1>Espace réservé</h1>
      <p>Entre ton code pour accéder à cette section. Contenu réservé à un public averti et majeur.</p>
      <input type="password" inputmode="numeric" class="lock-pin" id="pinInput" placeholder="••••" maxlength="8" autocomplete="off">
      <button class="btn btn-primary" id="btnUnlock" style="width:100%;background:#ec4899">Déverrouiller</button>
      <div style="margin-top:14px">
        <a href="accueil.html" class="link-orange" style="font-size:12px">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <!-- Contenu (caché tant que verrouillé) -->
  <div id="secretContent" style="display:none">
    <div class="secret-banner">🔞 Espace +18 — contenu pour adultes · <a href="#" id="lockNow" style="text-decoration:underline">verrouiller</a></div>
    <div class="catalogue-layout container">
      <div class="catalogue-main" style="width:100%">
        <div class="catalogue-header">
          <div class="catalogue-header-left">
            <h1 class="catalogue-title">Catalogue +18</h1>
            <p class="catalogue-desc">Recherche dans le contenu adulte. Tape une recherche ou explore les tendances.</p>
            <div class="catalogue-quick-filters" id="quickFilters"></div>
          </div>
        </div>
        <div class="results-header">
          <div class="results-count" id="resultsCount"></div>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <div id="footer-slot"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/nsfw.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/secret.js"></script>
</body>
</html>
