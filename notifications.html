<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Notifications</title>
  <!-- meta:auto -->
    <meta name="description" content="Tes notifications : nouveaux chapitres des séries que tu suis.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Inko">
    <meta property="og:title" content="Inko — Notifications">
    <meta property="og:description" content="Tes notifications : nouveaux chapitres des séries que tu suis.">
    <meta property="og:image" content="/assets/img/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Inko — Notifications">
    <meta name="twitter:description" content="Tes notifications : nouveaux chapitres des séries que tu suis.">
    <!-- meta:auto -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/notifications.css">
</head>
<body class="page-body">
  <div id="header-slot"></div>
  <main id="main" tabindex="-1">
  <div class="nt-wrap">
    <div class="nt-head">
      <h1>Notifications</h1>
      <div class="nt-actions">
        <span id="ntFreshness" style="font-size:11.5px;color:var(--text3)"></span>
        <button class="btn btn-sm" id="ntRefresh" title="Actualiser" aria-label="Actualiser les notifications">↻ Actualiser</button>
        <button class="btn btn-sm" id="ntEnablePush" title="Recevoir les notifications même Inko fermé">🔔 Activer le push</button>
        <button class="btn btn-sm" id="ntMarkAll">Tout marquer lu</button>
      </div>
    </div>
    <!-- Audit AMEL-54 : le scan était global et non paramétrable. Le réglage
         vit ici, à côté de ce qu'il produit, plutôt que noyé dans les
         préférences générales. -->
    <div class="nt-prefs" id="ntPrefs" hidden>
      <label style="display:inline-flex;align-items:center;gap:8px">
        <span>Me prévenir</span>
        <select id="ntFreq" aria-label="Fréquence de vérification des nouveaux chapitres">
          <option value="4">toutes les 4 heures</option>
          <option value="12">deux fois par jour</option>
          <option value="24">une fois par jour</option>
          <option value="72">tous les 3 jours</option>
          <option value="0">jamais</option>
        </select>
      </label>
      <span class="nt-prefs-note" id="ntWatched"></span>
    </div>
    <div class="nt-filters" id="ntFilters">
      <button class="nt-pill active" aria-pressed="true" data-f="all">Toutes</button>
      <button class="nt-pill" aria-pressed="false" data-f="unread">Non lues</button>
      <button class="nt-pill" aria-pressed="false" data-f="reply">Réponses</button>
      <button class="nt-pill" aria-pressed="false" data-f="mention">Mentions</button>
      <button class="nt-pill" aria-pressed="false" data-f="chapter">Chapitres</button>
    </div>
    <div id="ntList"><div class="nt-empty"><div class="spinner-inline"></div></div></div>
  </div>
  </main>
  <div id="footer-slot"></div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/userdata.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/une-main.js"></script>
  <script src="assets/js/tirer-rafraichir.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
