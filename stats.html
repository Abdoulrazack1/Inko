  <style>
    .st-wrap { max-width: 1080px; margin: 0 auto; padding: 26px 20px 80px; }
    .st-head h1 { font-family: var(--font-head); font-size: 27px; font-weight: 700; margin-bottom: 4px; }
    .st-head p { color: var(--text2); font-size: 13.5px; margin-bottom: 24px; }
    .st-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .st-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .st-card .v { font-size: 30px; font-weight: 800; font-family: var(--font-head); line-height: 1; }
    .st-card .l { font-size: 12px; color: var(--text3); margin-top: 7px; }
    .st-card.accent .v { color: var(--orange); }
    .st-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 22px; }
    .st-panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    /* Heatmap */
    .hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 6px; }
    .hm i { width: 12px; height: 12px; border-radius: 3px; background: var(--bg4); }
    .hm i.l1 { background: #4a2410; } .hm i.l2 { background: #8a3d12; }
    .hm i.l3 { background: #d2691e; } .hm i.l4 { background: #ff8c42; }
    .hm-legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); margin-top: 10px; justify-content: flex-end; }
    .hm-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    /* Activity */
    .act { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .act:first-child { border-top: none; }
    .act .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
    .act .when { margin-left: auto; font-size: 11.5px; color: var(--text3); }
    .st-empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  </style>
</head>
