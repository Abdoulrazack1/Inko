<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Lecture</title>
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); }
    .lr-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
    .lr-bar a.back { color: var(--text2); text-decoration: none; font-size: 13px; }
    .lr-title { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lr-bar select { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 50vw; }
    /* CBZ : images empilées (webtoon) */
    .lr-images img { display: block; width: 100%; max-width: 860px; margin: 0 auto; }
    /* EPUB : colonne de texte lisible */
    .lr-text { max-width: 720px; margin: 0 auto; padding: 30px 22px 90px; font-size: 18px; line-height: 1.75; font-family: var(--font-read); }
    .lr-text img { max-width: 100%; height: auto; }
    .lr-text h1, .lr-text h2, .lr-text h3 { line-height: 1.3; }
    .lr-msg { text-align: center; padding: 80px 20px; color: var(--text3); }
    .lr-nav { display: flex; justify-content: space-between; gap: 10px; max-width: 720px; margin: 20px auto 0; padding: 0 22px; }
    /* Paragraphe en cours de lecture audio (TTS EPUB) */
    .tts-reading { background: color-mix(in srgb, var(--orange) 18%, transparent); border-radius: 6px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 18%, transparent); }
  </style>
</head>
<body>
  <div class="lr-bar">
    <a href="import.html" class="back">← Bibliothèque</a>
    <span class="lr-title" id="lrTitle">Chargement…</span>
    <select id="lrChapters" style="display:none"></select>
  </div>
  <div id="lrBody"><div class="lr-msg"><div class="spinner-inline"></div></div></div>
  <script src="assets/vendor/jszip.min.js"></script>
  <script src="assets/vendor/pdf.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/localreader.js"></script>
</body>
</html>
