name: Sources health

# Santé des extensions de scraping (audit B-6). Les sites cassent en silence
# (changement de balisage, blocage Cloudflare) — ce job appelle popular() sur
# chaque source et échoue si l'une renvoie 0 résultat ou une erreur, pour être
# prévenu AVANT les utilisateurs. Hebdomadaire + déclenchable à la main.
on:
  schedule:
    - cron: '17 6 * * 1'   # tous les lundis 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # BUG-06 : le job ouvre une issue quand une source casse

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install server deps (cheerio, axios…)
        working-directory: server
        run: npm ci --omit=dev

      - name: Run source health check on community extensions
        id: check
        continue-on-error: true
        env:
          EXT_DIR: extensions-community
        run: |
          set -o pipefail
          node scripts-ci/check-sources.js 2>&1 | tee rapport.txt

      # BUG-06 : l'alarme sonnait dans le vide. Ce job était ROUGE depuis le
      # 20 juillet, quatre lundis de suite — il fonctionnait, il disait vrai,
      # et personne n'agissait. Un point rouge dans un onglet que personne
      # n'ouvre n'est pas une alerte.
      #
      # Il ouvre donc une issue, et la MET À JOUR au lieu d'en créer une par
      # semaine : quatre issues identiques seraient aussi faciles à ignorer que
      # quatre runs rouges. Elle se referme d'elle-même quand tout répond, avec
      # le rapport en commentaire — pour qu'on sache que c'est réparé, et non
      # abandonné.
      - name: Ouvrir ou mettre à jour l'issue « sources en panne »
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITRE: Sources en panne — vérification hebdomadaire
        run: |
          {
            echo "Le contrôle hebdomadaire a trouvé au moins une source CASSÉE :"
            echo "elle répond, mais ne renvoie rien d'exploitable, ou rompt son contrat"
            echo "(limite ignorée, entrées sans identifiant ou sans titre)."
            echo
            echo "Les sources marquées ⚠ ont simplement refusé le runner GitHub (403, 429,"
            echo "délai) : ces sites bloquent les adresses de centres de données. Elles ne"
            echo "sont PAS comptées comme cassées — vérifier depuis une connexion domestique"
            echo "avant de conclure."
            echo
            echo '```'
            cat rapport.txt
            echo '```'
            echo
            echo "Run : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > corps.md
          NUM=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file corps.md
          else
            gh issue create --title "$TITRE" --body-file corps.md
          fi

      - name: Refermer l'issue si tout répond
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITRE: Sources en panne — vérification hebdomadaire
        run: |
          NUM=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            {
              echo "Toutes les sources répondent à nouveau."
              echo
              echo '```'
              cat rapport.txt
              echo '```'
            } > corps.md
            gh issue close "$NUM" --comment "$(cat corps.md)"
          fi

      # Le job reste ROUGE quand une source est cassée : l'issue s'ajoute au
      # signal, elle ne le remplace pas.
      - name: Refléter l'état du contrôle
        if: steps.check.outcome == 'failure'
        run: exit 1
