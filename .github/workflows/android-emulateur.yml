name: APK — démarrage sur émulateur

# L'APK était CONSTRUIT et son contenu VÉRIFIÉ, mais personne ne l'avait jamais
# lancé. « Le zip contient les bons fichiers » ne dit rien de « l'app s'ouvre » :
# une CSP qui bloque, un script qui jette, un WebView qui refuse le schéma, et
# l'utilisateur voit un écran blanc alors que tous les contrôles sont verts.
#
# C'est exactement le défaut des installeurs desktop 2.5.1 et 2.5.2 transposé au
# mobile : la seule vérification qui compte est celle du PRODUIT, en marche.
#
# Ce job démarre un émulateur Android, installe l'APK, l'ouvre, et regarde :
#   · le processus tourne-t-il encore après le démarrage ?
#   · logcat contient-il une exception fatale ?
#   · l'écran affiche-t-il quelque chose ? (capture en pièce jointe)
#
# Séparé du job de build : un émulateur coûte ~10 min, là où le build en prend 2.
# On ne veut pas payer ça à chaque poussée sur une feuille de style.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'    # tous les lundis, avec le contrôle des sources
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'assets/js/hub.js'
      - '.github/workflows/android-emulateur.yml'

permissions:
  contents: read

jobs:
  demarrage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances
        run: npm ci || npm install

      - name: Préparer le contenu embarqué
        run: node scripts-ci/build-mobile-www.js

      - name: Synchroniser Capacitor
        run: npx cap sync android

      # L'APK est construit ICI, pas dans le script de l'émulateur : compiler
      # pendant qu'un émulateur tourne gaspille sa fenêtre de vie, et un échec
      # de compilation se lirait alors comme un échec de démarrage.
      - name: Construire l'APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Vérifier le contenu de l'APK
        run: node scripts-ci/verifier-apk.js --apk

      # Sans accélération matérielle, le démarrage de l'émulateur dépasse
      # largement le temps imparti.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Démarrer l'app sur un émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 26 : le plancher que l'app déclare. Vérifier là où ça casse en
          # premier a plus de valeur que sur la dernière version d'Android.
          api-level: 26
          # `google_apis` et non `default` : l'image `default` d'API 26
          # N'EMBARQUE PAS DE WEBVIEW. L'app s'y lançait sans pouvoir rien
          # afficher, et le contrôle passait quand même — c'est ce qui a mis
          # ce défaut au jour.
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # UNE seule ligne : l'action exécute le script ligne par ligne, chacune
          # dans son propre shell — un `cd` n'y survit pas.
          script: bash scripts-ci/emulateur-demarrage.sh

      - name: Publier la capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-demarrage
          path: /tmp/demarrage.png
          if-no-files-found: warn
          retention-days: 14
