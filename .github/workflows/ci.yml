name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Security audit (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check (node --check)
        run: |
          for f in server.js routes/index.js db/migrate.js \
                   $(ls controllers/*.js) $(ls middleware/*.js) $(ls lib/*.js); do
            node --check "$f"
          done

      - name: Load all modules (smoke)
        run: node -e "require('./routes'); require('./db/migrate'); console.log('modules OK')"

      - name: Unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t inko:ci .
