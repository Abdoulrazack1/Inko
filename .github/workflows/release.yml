name: Release

# Pousse un tag v* → build de l'installeur Windows et publication
# automatique sur la release GitHub (façon Mihon : le repo suffit,
# personne n'a besoin de builder quoi que ce soit).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-tauri/src-tauri/Cargo.lock') }}

      - name: Install server dependencies (embedded in the app)
        working-directory: server
        run: npm ci --omit=dev

      - name: Install desktop dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build Tauri app (prep + cargo + NSIS)
        working-directory: desktop-tauri
        run: npm run build

      # On inspecte le .exe REELLEMENT produit, pas le dossier qui a servi a le
      # construire. Les versions 2.5.1 et 2.5.2 sont parties avec zero source :
      # le dossier de reference etait bien prepare, mais absent de la liste
      # blanche `bundle.resources` de Tauri. Le controle existant regardait la
      # preparation, donc il etait vert. Celui-ci ouvre l'archive.
      - name: Verifier le contenu de l'installeur
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          node scripts-ci/verifier-installeur.js $setup.FullName

      - name: Stable-name copy for the permanent download link
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "Inko-Setup.exe"
          "Asset: $($setup.Name)"

      # Audit SEC-03 : la mise à jour intégrée lançait l'installeur après un seul
      # contrôle — « le fichier pèse plus d'1 Mo ». Elle vérifie désormais une
      # empreinte publiée ; encore faut-il la publier. Les noms de fichiers sont
      # ceux que verra le client (pas de chemin), pour correspondre au format
      # standard « <sha256>  <nom> ».
      - name: Publier les empreintes SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe") +
                   @(Get-ChildItem "Inko-Setup.exe")
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS" -Encoding ascii
          Get-Content "SHA256SUMS"

      # Le titre et les notes etaient poses A LA MAIN apres chaque publication —
      # donc oubliables, et oublies : la v2.6.0 est sortie intitulee « v2.6.0 »
      # avec un corps vide, alors que le CHANGELOG contenait deja les 57 lignes
      # qu'il fallait. Ils en sont desormais DERIVES.
      - name: Titre et notes depuis le CHANGELOG
        id: notes
        shell: bash
        run: |
          node scripts-ci/notes-release.js "${GITHUB_REF_NAME#v}"
          echo "titre=$(cat RELEASE_TITLE.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.titre }}
          body_path: RELEASE_NOTES.md
          files: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            Inko-Setup.exe
            SHA256SUMS
