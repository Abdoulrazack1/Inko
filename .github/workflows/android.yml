name: APK Android

# Audit P2.1 / P2.6 — l'APK se construit ICI, et nulle part ailleurs.
#
# La machine de développement n'a ni JDK, ni SDK Android, ni Gradle : les
# installer représente ~2 Go et une chaîne à maintenir à la main. Le runner
# GitHub a déjà le JDK et sait installer le SDK en cache. Le build est donc
# reproductible, et l'APK arrive en pièce jointe du run — téléchargeable
# depuis le téléphone directement.
#
# Debug uniquement pour l'instant : un APK signé pour distribution demande une
# clé, donc un secret de dépôt, donc une décision qui n'est pas technique.
# Un APK de debug s'installe très bien (« sources inconnues ») et c'est ce
# qu'il faut pour essayer l'app.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - '*.html'
      - 'capacitor.config.json'
      - 'scripts-ci/build-mobile-www.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  # `write` parce que ce workflow publie desormais l'APK dans une pre-release
  # roulante — voir l'etape « Publier le dernier APK » en bas.
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Dépendances
        run: npm ci || npm install

      # Le contenu embarqué est RECONSTRUIT à chaque build : sans ça, l'APK
      # figerait la version du front présente au moment du `cap add`, et
      # personne ne s'en apercevrait avant de constater une correction absente
      # sur le téléphone.
      - name: Préparer le contenu embarqué
        run: node scripts-ci/build-mobile-www.js

      - name: Synchroniser Capacitor
        run: npx cap sync android

      # Garde-fou : l'APK doit contenir le front, pas une coque vide. C'est
      # exactement le défaut qui a fait sortir deux installeurs desktop sans
      # aucune source (2.5.1 puis 2.5.2) — la vérification a posteriori du
      # PRODUIT est la seule qui l'attrape.
      - name: Vérifier que le contenu est bien embarqué
        run: node scripts-ci/verifier-apk.js --assets

      # Le dépôt est tenu depuis Windows, où le bit d'exécution n'existe pas :
      # git a enregistré `gradlew` en 100644 et le runner Linux refuse de le
      # lancer (code 126). Le mode est corrigé dans l'index par ailleurs ;
      # ce `chmod` reste pour que le job survive à un checkout qui l'aurait
      # perdu — il ne coûte rien et évite un échec opaque.
      - name: Construire l'APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Vérifier l'APK produit
        run: node scripts-ci/verifier-apk.js --apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: inko-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── Une URL stable, pour un vrai bouton de telechargement ──
      #
      # Un artefact de run ne se telecharge PAS d'un lien : il faut un compte
      # GitHub, ouvrir le bon run, descendre jusqu'aux pieces jointes. Pour
      # « installe l'app sur ton telephone », c'est un mur — alors que le
      # bouton Windows du README pointe, lui, sur un fichier.
      #
      # L'APK est donc aussi publie dans une PRE-RELEASE roulante `apk-latest`,
      # qui suit toujours `main`. L'adresse ne change jamais :
      #
      #   .../releases/download/apk-latest/inko.apk
      #
      # Pourquoi une pre-release et pas la release de version : celle-ci porte
      # une version figee et un APK SIGNE (android-release.yml, sur un tag).
      # Melanger un build de debug qui change a chaque commit avec une version
      # publiee tromperait sur ce qu'on telecharge. Marquee `prerelease`, elle
      # n'apparait jamais comme « derniere version » et ne remplace donc pas
      # l'installeur Windows dans les liens `releases/latest`.
      - name: Publier le dernier APK (pre-release roulante)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nom FIXE : c'est ce qui rend l'URL stable. Le nom produit par
          # Gradle porte la variante, et changerait donc le lien.
          cp android/app/build/outputs/apk/debug/*.apk inko.apk
          sha256sum inko.apk > SHA256SUMS-apk.txt

          cat > notes.md <<NOTES
          APK de **debug**, reconstruit a chaque changement sur \`main\`.

          - Commit : \`${GITHUB_SHA:0:7}\`
          - Construit le : $(date -u '+%Y-%m-%d %H:%M UTC')

          Il s'installe en autorisant les « sources inconnues » : il est signe
          avec la cle de debug d'Android, comme toute application distribuee
          hors magasin.

          Pour une version figee et signee, voir les releases \`v*\`.
          NOTES

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes-file notes.md --prerelease
          else
            gh release create apk-latest --prerelease               --title "Dernier APK (build de main)" --notes-file notes.md
          fi
          # `--clobber` remplace le fichier a chaque build : l'adresse ne
          # change pas, le contenu suit main.
          gh release upload apk-latest inko.apk SHA256SUMS-apk.txt --clobber
