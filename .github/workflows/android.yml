name: APK Android

# Audit P2.1 / P2.6 — l'APK se construit ICI, et nulle part ailleurs.
#
# La machine de développement n'a ni JDK, ni SDK Android, ni Gradle : les
# installer représente ~2 Go et une chaîne à maintenir à la main. Le runner
# GitHub a déjà le JDK et sait installer le SDK en cache. Le build est donc
# reproductible, et l'APK arrive en pièce jointe du run — téléchargeable
# depuis le téléphone directement.
#
# Debug uniquement pour l'instant : un APK signé pour distribution demande une
# clé, donc un secret de dépôt, donc une décision qui n'est pas technique.
# Un APK de debug s'installe très bien (« sources inconnues ») et c'est ce
# qu'il faut pour essayer l'app.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - '*.html'
      - 'capacitor.config.json'
      - 'scripts-ci/build-mobile-www.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Dépendances
        run: npm ci || npm install

      # Le contenu embarqué est RECONSTRUIT à chaque build : sans ça, l'APK
      # figerait la version du front présente au moment du `cap add`, et
      # personne ne s'en apercevrait avant de constater une correction absente
      # sur le téléphone.
      - name: Préparer le contenu embarqué
        run: node scripts-ci/build-mobile-www.js

      - name: Synchroniser Capacitor
        run: npx cap sync android

      # Garde-fou : l'APK doit contenir le front, pas une coque vide. C'est
      # exactement le défaut qui a fait sortir deux installeurs desktop sans
      # aucune source (2.5.1 puis 2.5.2) — la vérification a posteriori du
      # PRODUIT est la seule qui l'attrape.
      - name: Vérifier que le contenu est bien embarqué
        run: node scripts-ci/verifier-apk.js --assets

      # Le dépôt est tenu depuis Windows, où le bit d'exécution n'existe pas :
      # git a enregistré `gradlew` en 100644 et le runner Linux refuse de le
      # lancer (code 126). Le mode est corrigé dans l'index par ailleurs ;
      # ce `chmod` reste pour que le job survive à un checkout qui l'aurait
      # perdu — il ne coûte rien et évite un échec opaque.
      - name: Construire l'APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Vérifier l'APK produit
        run: node scripts-ci/verifier-apk.js --apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: inko-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
