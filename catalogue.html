<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inko — Catalogue</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ff6b1a">
  <link rel="icon" type="image/svg+xml" href="./assets/img/icon.svg">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/catalogue.css">
</head>
<body class="page-body">
  <div id="header-slot"></div>

  <div class="catalogue-layout container">

    <!-- ══ SIDEBAR FILTRES ══════════════════════════════════ -->
    <aside class="filters-sidebar" id="filtersSidebar">
      <div class="filters-header">
        <span class="filters-title">Filtres</span>
        <button class="filters-reset" id="filtersReset">Réinitialiser</button>
      </div>

      <div class="filter-section">
        <div class="filter-label">Genres</div>
        <div class="filter-tags" id="filterGenres"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Statut</div>
        <div class="filter-status" id="filterStatus"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Démographie</div>
        <div class="filter-checkboxes" id="filterDemo"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Dernières sorties</div>
        <div id="weekCalendar"></div>
      </div>
    </aside>

    <!-- ══ CONTENU PRINCIPAL ════════════════════════════════ -->
    <div class="catalogue-main">

      <!-- Header catalogue -->
      <div class="catalogue-header">
        <div class="catalogue-header-left">
          <h1 class="catalogue-title">Catalogue Ultimate</h1>
          <p class="catalogue-desc">Explorez des milliers de mangas, webtoons et manhwas avec des recommandations intelligentes, des filtres ultra-précis et une mise à jour continue.</p>
          <div class="catalogue-chips" id="catalogueChips"></div>
          <div class="catalogue-quick-filters" id="quickFilters"></div>
          <div class="catalogue-actions-bar">
            <button class="btn btn-primary btn-sm" id="btnRandom">
              Lecture aléatoire
            </button>
            <span class="catalogue-active-filters" id="activeFiltersCount"></span>
          </div>
        </div>
        <div class="catalogue-focus" id="catalogueFocus"></div>
      </div>

      <!-- Team picks -->
      <div class="team-picks-section">
        <div class="section-header">
          <div class="section-title">Les incontournables</div>
        </div>
        <div class="team-picks-grid" id="teamPicksGrid"></div>
      </div>

      <!-- Results header -->
      <div class="results-header">
        <div class="results-count" id="resultsCount"></div>
        <div class="results-actions">
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" title="Grille">⊞</button>
            <button class="view-btn" data-view="list" title="Liste">☰</button>
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="popularity">Popularité</option>
            <option value="latest">Mis à jour</option>
            <option value="added">Nouveautés</option>
            <option value="rating">Note</option>
            <option value="alpha">A → Z</option>
          </select>
        </div>
      </div>

      <!-- Results grid -->
      <div class="results-grid" id="resultsGrid"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>

      <!-- Collections thématiques -->
      <div class="catalogue-collections">
        <div class="section-header">
          <div class="section-title">Collections thématiques</div>
          <a href="collections.html" class="section-link">Voir toutes les collections →</a>
        </div>
        <div class="collections-mini-grid" id="collectionsMiniGrid"></div>
      </div>

    </div>
  </div>

  <div id="footer-slot"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/nsfw.js"></script>
  <script src="assets/js/global.js"></script>
  <script src="assets/js/catalogue.js"></script>
  <script src="assets/js/card-hover.js"></script>
  <script src="assets/js/eula.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
